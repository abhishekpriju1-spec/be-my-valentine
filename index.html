<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be My Valentine 💘</title>

<style>
  * {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    z-index: 2;
  }

  h1 {
    color: #ff4d6d;
    margin-bottom: 20px;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    position: relative;
  }

  button {
    padding: 12px 28px;
    font-size: 18px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
  }

  #yesBtn {
    background: #ff4d6d;
    color: white;
    z-index: 1;
  }

  #noBtn {
    background: #e0e0e0;
    position: fixed;
    opacity: 0;
    z-index: 3;
  }

  .note {
    margin-top: 15px;
    font-size: 12px;
    color: #666;
    font-style: italic;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(-120vh) scale(1.5);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my Valentine Petra Mary Prasad? 💖</h1>
  <div class="buttons">
    <button id="yesBtn">YES 💘</button>
  </div>
  <div class="note">* the NO button is shy 🙈</div>
</div>

<button id="noBtn">NO 😜</button>

<audio id="yesSound" src="yes.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const yesSound = document.getElementById("yesSound");

  let speed = 1;

  function moveNoButton(first = false) {
    const padding = 20;
    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    let x, y;

    if (first) {
      x = Math.random() * maxX;
      y = window.innerHeight - noBtn.offsetHeight - padding;
    } else {
      x = Math.random() * maxX;
      y = Math.random() * maxY;
    }

    noBtn.style.transition = `
      left ${0.35 / speed}s,
      top ${0.35 / speed}s,
      opacity 0.2s
    `;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.opacity = "1";

    speed += 0.3;
  }

  window.addEventListener("DOMContentLoaded", () => {
    moveNoButton(true);
  });

  noBtn.addEventListener("mouseover", () => moveNoButton());
  noBtn.addEventListener("touchstart", () => moveNoButton());

  yesBtn.addEventListener("click", () => {
    yesSound.play();

    confetti({
      particleCount: 150,
      spread: 70,
      origin: { y: 0.6 }
    });

    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        background:linear-gradient(135deg,#ffdde1,#ee9ca7);
        color:#fff;
        text-align:center;
      ">
        <h1>YAYYY!!! 💖🎉</h1>
        <p>You just made my heart so happy 💕</p>
      </div>
    `;
  });

  // Floating hearts generator
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = 16 + Math.random() * 20 + "px";
    heart.style.animationDuration = 4 + Math.random() * 4 + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
  }, 400);
</script>

</body>
</html>
