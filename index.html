<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be My Valentine 💘</title>

<style>
  * {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    z-index: 2;
  }

  h1 {
    color: #ff4d6d;
    margin-bottom: 20px;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    position: relative;
  }

  button {
    padding: 12px 28px;
    font-size: 18px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s;
  }

  button:hover {
    transform: scale(1.05);
  }

  #yesBtn {
    background: #ff4d6d;
    color: white;
    z-index: 1;
  }

  #noBtn {
    background: #e0e0e0;
    position: fixed;
    opacity: 0;
    z-index: 3;
  }

  .note {
    margin-top: 15px;
    font-size: 12px;
    color: #666;
    font-style: italic;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(-120vh) scale(1.5);
      opacity: 0;
    }
  }

  /* Overlay for YES message */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg,#ffdde1,#ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #fff;
    text-align: center;
    z-index: 10;
    overflow: hidden;
  }

  .overlay h1 {
    font-size: 3em;
    margin-bottom: 15px;
    animation: pop 0.5s ease;
  }

  .overlay p {
    font-size: 1.5em;
    margin: 5px 0;
    opacity: 0;
    animation: fadeIn 1s forwards;
  }

  .overlay p:nth-child(2) { animation-delay: 0.5s; }
  .overlay p:nth-child(3) { animation-delay: 1s; }
  .overlay p:nth-child(4) { animation-delay: 1.5s; }

  @keyframes pop {
    0% { transform: scale(0); opacity:0; }
    100% { transform: scale(1); opacity:1; }
  }

  @keyframes fadeIn {
    0% { opacity:0; transform: translateY(20px); }
    100% { opacity:1; transform: translateY(0); }
  }
</style>
</head>

<body>

<div class="container" id="mainContainer">
  <h1>Will you be my Valentine Petra Mary Prasad? 💖</h1>
  <div class="buttons">
    <button id="yesBtn">YES 💘</button>
  </div>
  <div class="note">* the NO button is shy 🙈</div>
</div>

<button id="noBtn">NO 😜</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const mainContainer = document.getElementById("mainContainer");

  let speed = 1;

  function moveNoButton(first = false) {
    const padding = 20;
    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    let x, y;

    if (first) {
      x = Math.random() * maxX;
      y = window.innerHeight - noBtn.offsetHeight - padding;
    } else {
      x = Math.random() * maxX;
      y = Math.random() * maxY;
    }

    noBtn.style.transition = `
      left ${0.35 / speed}s,
      top ${0.35 / speed}s,
      opacity 0.2s
    `;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.opacity = "1";

    speed += 0.3;
  }

  window.addEventListener("DOMContentLoaded", () => {
    moveNoButton(true);
  });

  noBtn.addEventListener("mouseover", () => moveNoButton());
  noBtn.addEventListener("touchstart", () => moveNoButton());

  yesBtn.addEventListener("click", () => {
    confetti({
      particleCount: 150,
      spread: 70,
      origin: { y: 0.6 }
    });

    // Create overlay
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <h1>YAYYY!!! 💖🎉</h1>
      <p class="msg">You just made my heart so happy 💕</p>
      <p class="msg">Every moment with you feels magical ✨</p>
      <p class="msg">Thank you for being the most wonderful Valentine ❤️</p>
    `;
    document.body.appendChild(overlay);

    // Start animations after render
    setTimeout(() => {
      const messages = overlay.querySelectorAll('.msg');
      messages.forEach((p, i) => {
        p.style.animation = `fadeIn 1s forwards`;
        p.style.animationDelay = `${0.5 + i*0.5}s`;
      });
    }, 50); // tiny delay to let browser render overlay

    // Floating hearts on overlay
    const heartInterval = setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 16 + Math.random() * 25 + "px";
      heart.style.animationDuration = 4 + Math.random() * 4 + "s";
      overlay.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }, 300);

    // Hearts follow mouse on overlay
    overlay.addEventListener("mousemove", (e) => {
      const followHeart = document.createElement("div");
      followHeart.className = "heart";
      followHeart.innerText = "💘";
      followHeart.style.left = e.clientX + "px";
      followHeart.style.top = e.clientY + "px";
      followHeart.style.fontSize = 14 + Math.random() * 20 + "px";
      followHeart.style.animationDuration = 3 + Math.random() * 2 + "s";
      overlay.appendChild(followHeart);
      setTimeout(() => followHeart.remove(), 2000);
    });
});

  // Floating hearts on main page
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = 16 + Math.random() * 20 + "px";
    heart.style.animationDuration = 4 + Math.random() * 4 + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
  }, 400);
</script>

</body>
</html>
