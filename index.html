<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💘</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp linear forwards;
      opacity: 0.8;
      pointer-events: none;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    .container {
      background: white;
      padding: 30px 20px;
      width: 90%;
      max-width: 360px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #ff4d6d;
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #noBtn {
      background: #e0e0e0;
      position: fixed;
      visibility: hidden; /* 🔥 prevents initial overlap */
    }

    .shy-text {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Will you be my Valentine? 💕</h1>
    <p class="subtitle">Because life would be cuter with you in it 🥹</p>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😢</button>
    </div>

    <p class="shy-text">
      * The NO button is shy and runs away 🙈 *
    </p>
  </div>

  <!-- Cute sound -->
  <audio id="yesSound" preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_5c4d88e3b0.mp3" type="audio/mpeg">
  </audio>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const yesSound = document.getElementById("yesSound");

    let speedMultiplier = 1;
    let audioUnlocked = false;

    /* 🔊 Unlock audio on first interaction */
    function unlockAudio() {
      if (!audioUnlocked) {
        yesSound.play().then(() => {
          yesSound.pause();
          yesSound.currentTime = 0;
          audioUnlocked = true;
        }).catch(() => {});
      }
    }

    document.addEventListener("click", unlockAudio, { once: true });
    document.addEventListener("touchstart", unlockAudio, { once: true });

    /* 😈 Move NO button */
    function moveNoButton(show = true) {
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.transition = `left ${0.3 / speedMultiplier}s, top ${0.3 / speedMultiplier}s`;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      if (show) {
        noBtn.style.visibility = "visible";
      }

      speedMultiplier += 0.3;
    }

    /* 🔥 Position NO button BEFORE showing */
    window.addEventListener("DOMContentLoaded", () => {
      moveNoButton(true);
    });

    noBtn.addEventListener("mouseover", () => moveNoButton());
    noBtn.addEventListener("touchstart", () => moveNoButton());

    /* 💖 YES click */
    yesBtn.addEventListener("click", () => {
      yesSound.currentTime = 0;
      yesSound.play();

      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          text-align:center;
          font-family:Poppins,sans-serif;
          background:linear-gradient(135deg,#ff758c,#ff7eb3);
          color:white;
          padding:20px;
          font-size:1.8rem;
        ">
          💘 Yayyyy! You just made my heart do backflips 💘<br><br>
          Can't wait for our cutest Valentine ever 😍
        </div>
      `;
    });
